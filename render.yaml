services:
  - type: web
    name: notes-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notes-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: notes-db
    plan: free
